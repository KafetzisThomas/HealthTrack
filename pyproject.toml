[project]
name = "healthtrack"
version = "0.1.0"
description = "Real-time hospital patient monitoring with clinical anomaly detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "redis<9",
    "crispy-bootstrap5>=2026.9",
    "daphne>=4.2.3",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-axes[ipware]>=8.3.1",
    "django-crispy-forms>=2.7",
    "prettytable>=3.18.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "pydotplus>=2.0.2",
    "ruff>=0.16.10",
]
